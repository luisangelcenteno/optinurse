<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OptiNurse - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-5">
                <div class="card login-card border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img src="logo.png" width="100" alt="Logo">
                            <h2 class="fw-bold mt-3 text-primary">OptiNurse</h2>
                            <p class="text-muted">Gestión de Emergencia Pediátrica</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input 
                                    type="text" 
                                    id="usuario"
                                    class="form-control form-control-lg" 
                                    placeholder="Ingrese su DNI"
                                    minlength="8"
                                    maxlength="8"
                                >
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Contraseña</label>
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg" 
                                    placeholder="********"
                                >
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 shadow">
                                Ingresar al Sistema
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" data-bs-toggle="modal" data-bs-target="#videoModal" class="video-link">Ver videotutorial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Videotutorial</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <video id="tutorialVideo" class="w-100 rounded" controls autoplay>
                        <source src="videotutorial.mp4" type="video/mp4">
                        Tu navegador no soporta video HTML5.
                    </video>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnOmitir">
                        Omitir video
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            const modalElement = document.getElementById('videoModal');
            const video = document.getElementById('tutorialVideo');
            const btnOmitir = document.getElementById('btnOmitir');
            const videoModal = new bootstrap.Modal(modalElement);

            videoModal.show();

            btnOmitir.addEventListener('click', () => {
                video.pause();
                video.currentTime = 0;
            });

            modalElement.addEventListener('hidden.bs.modal', () => {
                video.pause();
                video.currentTime = 0;
            });
        });

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value;
            localStorage.setItem("usuario", usuario);

            if (usuario === "77777777") { // Perfil Administrador
                window.location.href = "usuarios.html";
            } else if (usuario === "66666666" || usuario === "44444444" || usuario === "33333333" || usuario === "22222222") { // Perfil Enfermera
                window.location.href = "dashboard.html";
            } else if (usuario === "55555555") { // Perfil Consulta
                window.location.href = "reportes.html";
            } else {
                alert("Usuario no válido");
            }
        });
    </script>

</body>
</html>
